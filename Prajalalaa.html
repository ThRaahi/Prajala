<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You, Baba ♡</title>
<style>
:root{
  --ivory:#f8f0e3;
  --parchment:#f4e8d8;
  --blush:#f6dee2;
  --blush2:#f1d3d9;
  --peach:#f3d8c2;
  --lavender:#e6dcee;
  --mauve:#d8b7c3;
  --mauve-deep:#c299ab;
  --sage:#cdd6bd;
  --sage-deep:#a9b894;
  --powder:#cfe0e6;
  --gold:#b8935a;
  --gold-light:#d9b783;
  --rose-mid:#cf98a3;
  --rose-deep:#b06e7c;
  --rose-pale:#eec7cd;
  --ink:#4a2e2a;
  --ink-soft:#5c3a45;
  --plum:#5a3348;
  --shadow-warm: 30, 18, 16;
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif;
  --script:'Segoe Script','Brush Script MT','Lucida Handwriting',cursive;
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  padding:0;
  background:#2c211d;
  background:radial-gradient(ellipse at 50% 20%, #3a2b26 0%, #241a17 70%, #1b1310 100%);
  font-family:var(--serif);
  color:var(--ink);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
::selection{background:var(--mauve);color:var(--ink);}

/* ---------- ambient background petals ---------- */
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#ambient span{
  position:absolute; top:-5%;
  font-size:14px;
  opacity:.35;
  color:var(--rose-pale);
  animation:driftDown linear infinite;
  filter:blur(.2px);
}
@keyframes driftDown{
  0%{transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0;}
  10%{opacity:.35;}
  90%{opacity:.28;}
  100%{transform:translateY(110vh) translateX(30px) rotate(180deg); opacity:0;}
}

/* ---------- stage ---------- */
#stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  perspective:3200px;
  z-index:1;
  padding:14px;
}
#bookWrap{
  position:relative;
  width:min(62vw, 620px);
  height:min(92vh, 880px);
  transform-style:preserve-3d;
}

/* ================= BOOK ================= */
#book{
  position:absolute; inset:0;
  transform-style:preserve-3d;
}

/* under-stack: gives page-block thickness illusion */
.pageblock{
  position:absolute;
  top:2%; bottom:2%;
  width:48%;
  background:
    repeating-linear-gradient(to bottom,
      #ece0cd 0px, #ece0cd 1px, #e2d3bc 2px, #e2d3bc 3px);
  border-radius:3px;
  box-shadow: inset 0 0 6px rgba(80,50,30,.25);
}
.pageblock.left{ left:0; border-radius:6px 2px 2px 6px; transform:translateZ(-6px);}
.pageblock.right{ right:0; border-radius:2px 6px 6px 2px; transform:translateZ(-6px);}

/* the visible open pages */
.page-static{
  position:absolute; top:2%; bottom:2%;
  width:48%;
  overflow:hidden;
  border-radius:4px;
  box-shadow:0 10px 30px rgba(20,10,8,.35);
}
#leftPage{ left:0; border-radius:8px 3px 3px 8px; }
#rightPage{ right:0; border-radius:3px 8px 8px 3px; }

/* spine */
.spine{
  position:absolute; left:50%; top:0; bottom:0;
  width:34px; margin-left:-17px;
  background:linear-gradient(to right,
     rgba(0,0,0,.28), rgba(0,0,0,.05) 20%, rgba(0,0,0,.05) 80%, rgba(0,0,0,.28));
  z-index:40; pointer-events:none;
  filter:blur(1px);
}

/* ---------- PAPER base ---------- */
.paper{
  position:absolute; inset:0;
  background-color:var(--ivory);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.35), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(255,255,255,.25), transparent 45%),
    repeating-linear-gradient(120deg, rgba(120,90,60,.025) 0px, rgba(120,90,60,.025) 1px, transparent 2px, transparent 4px),
    repeating-linear-gradient(35deg, rgba(120,90,60,.02) 0px, rgba(120,90,60,.02) 1px, transparent 2px, transparent 5px);
  box-shadow:
    inset 0 0 40px rgba(120,80,50,.08),
    inset 0 0 3px rgba(90,60,40,.15);
}
.paper::after{ /* soft curled corner hint */
  content:"";
  position:absolute; right:0; bottom:0;
  width:46px; height:46px;
  background:linear-gradient(135deg, transparent 50%, rgba(150,110,70,.14) 52%, rgba(255,255,255,.5) 60%, transparent 62%);
  pointer-events:none;
}
.p-v1 .paper{background-color:var(--ivory);}
.p-v2 .paper{background-color:var(--blush);}
.p-v3 .paper{background-color:var(--parchment); background-image:
    radial-gradient(ellipse at 20% 10%, rgba(230,220,238,.55), transparent 55%),
    repeating-linear-gradient(120deg, rgba(120,90,60,.025) 0px, rgba(120,90,60,.025) 1px, transparent 2px, transparent 4px);}
.p-v4 .paper{background-color:var(--ivory); background-image:
    radial-gradient(ellipse at 85% 12%, rgba(205,214,189,.5), transparent 50%),
    repeating-linear-gradient(120deg, rgba(120,90,60,.025) 0px, rgba(120,90,60,.025) 1px, transparent 2px, transparent 4px);}
.p-v5 .paper{background-color:var(--peach);}
.p-v6 .paper{background-color:var(--parchment);}
.p-v7 .paper{background-color:var(--blush2);}
.p-v8 .paper{background-color:var(--ivory); background-image:
    radial-gradient(ellipse at 12% 88%, rgba(217,183,195,.4), transparent 50%),
    repeating-linear-gradient(120deg, rgba(120,90,60,.025) 0px, rgba(120,90,60,.025) 1px, transparent 2px, transparent 4px);}

/* gold frame variant */
.gold-frame .paper{
  outline:1px solid rgba(184,147,90,.55);
  outline-offset:-14px;
}
.gold-frame .paper::before{
  content:"";
  position:absolute; inset:20px;
  border:1px solid rgba(184,147,90,.35);
  pointer-events:none;
}

/* ---------- page content layout ---------- */
.leaf-inner{
  position:relative; z-index:2;
  height:100%;
  padding:9% 9% 8% 9%;
  display:flex; flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:var(--mauve) transparent;
}
.leaf-inner::-webkit-scrollbar{width:5px;}
.leaf-inner::-webkit-scrollbar-thumb{background:var(--mauve);border-radius:4px;}

.page-eyebrow{
  font-family:var(--script);
  font-size:15px;
  color:var(--rose-deep);
  opacity:.85;
  margin:0 0 6px 0;
  letter-spacing:.4px;
}
.page-title{
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  font-size:clamp(20px,3vw,28px);
  color:var(--plum);
  margin:0 0 14px 0;
  line-height:1.25;
}
.page-text{
  flex:1;
  font-size:clamp(15.5px,1.9vw,18px);
  line-height:1.78;
  color:var(--ink);
}
.page-text p{margin:0 0 1.05em 0;}
.page-text p.emph{
  font-family:var(--serif);
  font-style:italic;
  font-size:1.12em;
  color:var(--plum);
  text-align:center;
  margin:1.3em 0;
}
.page-num{
  align-self:center;
  font-family:var(--script);
  font-size:14px;
  color:var(--gold);
  opacity:.85;
  margin-top:8px;
}

/* ---------- decoration layer ---------- */
.deco{position:absolute; pointer-events:none; z-index:1;}
.deco svg{display:block; width:100%; height:100%;}

/* ================= COVER ================= */
.cover{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transform-origin:left center;
  z-index:100;
  border-radius:6px 10px 10px 6px;
  box-shadow:0 18px 55px rgba(10,5,5,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  transition:transform 1.5s cubic-bezier(.6,.05,.25,1);
  will-change:transform;
}
.cover-face{
  position:absolute; inset:0;
  backface-visibility:hidden;
  border-radius:inherit;
  overflow:hidden;
}
.cover-front{
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.10), transparent 55%),
    radial-gradient(ellipse at 75% 85%, rgba(0,0,0,.14), transparent 55%),
    linear-gradient(155deg, #cf9fae 0%, #c191a1 35%, #b7859a 65%, #a8768d 100%);
  box-shadow: inset 0 0 0 10px rgba(255,255,255,.06), inset 0 0 60px rgba(70,20,35,.25);
}
.cover-front::before{ /* fabric grain */
  content:""; position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 2px, transparent 4px),
    repeating-linear-gradient(25deg, rgba(0,0,0,.04) 0px, rgba(0,0,0,.04) 1px, transparent 2px, transparent 5px);
  mix-blend-mode:overlay;
}
.cover-inner-border{
  position:absolute; inset:18px;
  border:2px solid rgba(201,161,90,.75);
  border-radius:4px;
}
.cover-inner-border::before{
  content:"";
  position:absolute; inset:6px;
  border:1px solid rgba(201,161,90,.45);
}
.cover-content{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:10%;
  color:#4a2530;
}
.cover-eyebrow{
  font-family:var(--serif); font-style:italic; font-weight:600;
  font-size:clamp(13px,1.6vw,16px);
  letter-spacing:1.5px;
  color:#6b3a49;
  opacity:.9;
  margin-bottom:6px;
}
.cover-title{
  font-family:var(--script);
  font-size:clamp(30px,5vw,52px);
  color:#4a2432;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
  margin:6px 0 10px 0;
  line-height:1.15;
}
.cover-rose-orn{
  width:clamp(90px,14vw,150px);
  height:clamp(90px,14vw,150px);
  margin:14px 0;
}
.cover-sub{
  font-family:var(--serif); font-style:italic;
  font-size:clamp(14px,1.8vw,18px);
  color:#5c3040;
  margin-top:6px;
}
.cover-open-btn{
  margin-top:clamp(20px,4vh,42px);
  font-family:var(--serif); font-style:italic; letter-spacing:2px;
  font-size:clamp(12px,1.5vw,14px);
  color:#4a2432;
  background:transparent;
  border:1px solid rgba(74,36,50,.55);
  padding:10px 26px;
  border-radius:2px;
  cursor:pointer;
  position:relative;
}
.cover-open-btn::before,.cover-open-btn::after{
  content:"✦"; color:var(--gold); font-size:10px; margin:0 8px; opacity:.8;
}
.cover-open-btn:hover{background:rgba(255,255,255,.12);}
.cover-open-btn:focus-visible{outline:2px solid #4a2432; outline-offset:3px;}

.cover-corner{position:absolute; width:15%; height:15%; opacity:.85;}
.cc-tl{top:14px; left:14px;}
.cc-tr{top:14px; right:14px; transform:scaleX(-1);}
.cc-bl{bottom:14px; left:14px; transform:scaleY(-1);}
.cc-br{bottom:14px; right:14px; transform:scale(-1,-1);}

/* inside of front cover (visible once opened) */
.cover-inside{
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.4), transparent 60%),
    var(--blush);
  transform:rotateY(180deg);
}
.cover-inside-content{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:12%;
  text-align:center;
}
.cover-inside-content p{
  font-family:var(--script);
  font-size:clamp(16px,2.4vw,22px);
  color:var(--plum);
  line-height:1.6;
}

/* spine edge on cover for thickness */
.cover-edge{
  position:absolute; left:0; top:2%; bottom:2%; width:14px;
  background:linear-gradient(to right, #8a5a68, #b7859a);
  transform:rotateY(90deg) translateZ(7px);
  transform-origin:left;
  border-radius:4px 0 0 4px;
}

/* ================= FLIP LEAF ================= */
.flip-leaf{
  position:absolute; top:2%; bottom:2%;
  width:48%;
  z-index:60;
  perspective:2600px;
  pointer-events:none;
  display:none;
}
.flip-leaf.active{display:block;}
.flip-leaf.mode-right{right:0;}
.flip-leaf.mode-left{left:0;}
.band{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform 1.05s cubic-bezier(.5,.02,.28,1);
}
.mode-left .band{transform-origin:right center;}
.band .face{
  position:absolute; inset:0;
  backface-visibility:hidden;
  overflow:hidden;
  border-radius:3px 8px 8px 3px;
  box-shadow:0 0 18px rgba(20,10,8,.28);
}
.band .face.back{transform:rotateY(180deg);}
.mode-left .band .face{border-radius:8px 3px 3px 8px;}
.band.b1{clip-path:inset(0% 0 75% 0);}
.band.b2{clip-path:inset(25% 0 50% 0);}
.band.b3{clip-path:inset(50% 0 25% 0);}
.band.b4{clip-path:inset(75% 0 0% 0);}
.band .shade{
  position:absolute; inset:0;
  background:linear-gradient(to right, rgba(35,18,15,.42), rgba(35,18,15,0) 55%);
  opacity:0;
  pointer-events:none;
}
.mode-left .band .shade{background:linear-gradient(to left, rgba(35,18,15,.42), rgba(35,18,15,0) 55%);}
.band.shading .shade{animation:shadeWave 1.05s ease-in-out;}
.band.b1.shading .shade{animation-delay:0ms;}
.band.b2.shading .shade{animation-delay:70ms;}
.band.b3.shading .shade{animation-delay:140ms;}
.band.b4.shading .shade{animation-delay:210ms;}
@keyframes shadeWave{0%{opacity:0;}45%{opacity:.4;}100%{opacity:0;}}

.flip-leaf.next-active .band{transform:rotateY(-178deg);}
.flip-leaf.next-active .band.b1{transition-delay:0ms;}
.flip-leaf.next-active .band.b2{transition-delay:70ms;}
.flip-leaf.next-active .band.b3{transition-delay:140ms;}
.flip-leaf.next-active .band.b4{transition-delay:210ms;}

.flip-leaf.prev-active .band{transform:rotateY(0deg);}
.flip-leaf.prev-active .band.b1{transition-delay:0ms;}
.flip-leaf.prev-active .band.b2{transition-delay:70ms;}
.flip-leaf.prev-active .band.b3{transition-delay:140ms;}
.flip-leaf.prev-active .band.b4{transition-delay:210ms;}

/* ================= NAV ================= */
.tap-zone{position:absolute; top:0; bottom:0; width:14%; z-index:70; cursor:pointer; background:transparent;}
.tap-zone.left{left:0;}
.tap-zone.right{right:0;}

#controls{
  position:absolute; left:50%; bottom:-52px; transform:translateX(-50%);
  display:flex; align-items:center; gap:18px;
  z-index:90;
  font-family:var(--serif); font-style:italic;
}
.ctrl-btn{
  background:rgba(248,240,227,.92);
  border:1px solid var(--gold);
  color:var(--plum);
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px; cursor:pointer;
  box-shadow:0 4px 10px rgba(30,15,10,.3);
  transition:transform .2s ease, background .2s ease;
}
.ctrl-btn:hover{transform:translateY(-2px); background:#fff;}
.ctrl-btn:focus-visible{outline:2px solid var(--plum); outline-offset:2px;}
.ctrl-btn[disabled]{opacity:.35; cursor:default; pointer-events:none;}
#pageIndicator{
  color:#f2e2cf; font-size:13px; letter-spacing:1px; min-width:70px; text-align:center;
}
#closeBtn{
  position:absolute; top:-46px; right:6px; z-index:90;
  font-family:var(--serif); font-style:italic; font-size:13px;
  color:#f2e2cf; background:transparent; border:1px solid rgba(242,226,207,.5);
  padding:6px 14px; border-radius:2px; cursor:pointer; letter-spacing:1px;
  opacity:0; pointer-events:none; transition:opacity .4s ease;
}
#closeBtn.show{opacity:1; pointer-events:auto;}
#closeBtn:hover{background:rgba(255,255,255,.08);}

/* ============ RESPONSIVE ============ */
@media (max-width: 880px){
  #bookWrap{width:96vw; height:82vh;}
  .pageblock.left,#leftPage{display:none;}
  .pageblock.right{width:96%; left:2%; right:auto;}
  #rightPage{width:96%; left:2%; right:auto; border-radius:6px;}
  .spine{display:none;}
  .flip-leaf.mode-right{width:96%; left:2%; right:auto;}
  .leaf-inner{padding:11% 8% 9% 8%;}
  .page-title{font-size:clamp(19px,4.6vw,24px);}
  .page-text{font-size:clamp(15px,3.6vw,16.5px); line-height:1.72;}
  #controls{bottom:-46px; gap:14px;}
  .cover-content{padding:9% 8%;}
}
@media (max-width: 420px){
  #bookWrap{height:80vh;}
  .leaf-inner{padding:12% 7% 10% 7%;}
}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  .cover{transition:transform .35s linear;}
  .band{transition:transform .35s linear !important;}
  .band.shading .shade{animation:none;}
  #ambient span{animation:none; display:none;}
  .petal-fall{animation:none !important;}
}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>

<script>

/* ================= PAGE CONTENT ================= */

letterPage(1, DECOR.cornerRoseTL,
  p('I lost my favourite person, and the hardest part is knowing that a big part of it is because of me.') +
  p('I don\u2019t think I have ever loved anyone in my life the way I have loved you. And honestly, I don\u2019t think I have ever been this scared of losing anyone either.') +

letterPage(2, DECOR.cornerRoseBR,

  pe('I love you.') +
  p('I love you more deeply than I ever knew I could love someone.') +
  p('Every feeling I share with you was real.') +

letterPage(7, DECOR.budBL + DECOR.budBR,

/* ================= RENDER ================= */
var variantClass = function(n){ return 'p-v'+n; };

function pageInnerHTML(pg){
  if(pg.isFinal){
    return finalPageHTML();
  }
  var out = '<div class="paper"></div>' + (pg.decor||'') + '<div class="leaf-inner">';
  if(pg.eyebrow) out += '<div class="page-eyebrow">'+pg.eyebrow+'</div>';
  if(pg.title) out += '<div class="page-title">'+pg.title+'</div>';
  out += '<div class="page-text">'+pg.body+'</div>';
  out += '</div>';
  return out;
}

  return '<div class="paper"></div>'+
  '<div class="deco" style="top:0;left:0;width:32%;max-width:170px;opacity:.85;"><svg viewBox="0 0 140 140"><use href="#cornerbranch"/></svg></div>'+
  '<div class="deco" style="bottom:0;right:0;width:32%;max-width:170px;opacity:.85;transform:scale(-1,-1);"><svg viewBox="0 0 140 140"><use href="#cornerbranch"/></svg></div>'+

  '<div class="leaf-inner" style="align-items:center;text-align:center;justify-content:center;">'+
    '<div class="page-eyebrow" style="font-size:13px;letter-spacing:1px;">THE LAST PAGE</div>'+
    '<div class="page-title" style="margin-bottom:2px;">But not the end of what I feel.</div>'+
    '<svg viewBox="0 0 120 120" style="width:min(30%,140px);height:auto;margin:14px 0;--rp-l:#f1d0d6;--rp-d:#d9a5ad;--rp-c:#b06e7c;--rp-cc:#8a4457;"><use href="#rose"/></svg>'+
    '<div style="font-family:var(--script);font-size:clamp(28px,5vw,44px);color:var(--plum);margin:10px 0 18px 0;line-height:1.3;">I love you,<br>baby.</div>'+
    '<div class="page-text" style="flex:none;max-width:34em;">'+
      '<p>No matter what you decide, thank you for being the person I love the most.</p>'+
    '</div>'+

  '</div>'+
  '<div id="finalPetals" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;"></div>';

/* ================= STATE ================= */
var current = 0; // active/right page index
var isMobile = function(){ return window.innerWidth <= 880; };
var animating = false;

var leftPageEl = document.getElementById('leftPage');
var rightPageEl = document.getElementById('rightPage');
var flipLeaf = document.getElementById('flipLeaf');
var pageIndicator = document.getElementById('pageIndicator');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');

function renderStatic(){
  var mobile = isMobile();
  rightPageEl.className = 'page-static ' + variantClass(pages[current].variant || 1);
  rightPageEl.innerHTML = pageInnerHTML(pages[current]);
  if(!mobile){
    if(current > 0){
      var lp = pages[current-1];
      leftPageEl.className = 'page-static ' + variantClass(lp.variant || 1);
      leftPageEl.innerHTML = pageInnerHTML(lp);
    } else {
      leftPageEl.className = 'page-static';
      leftPageEl.innerHTML = '<div class="paper"></div><div class="leaf-inner" style="align-items:center;justify-content:center;text-align:center;">'+
        '<svg viewBox="0 0 120 120" style="width:36%;--rp-l:#eec7cd;--rp-d:#d9a5ad;--rp-c:#b06e7c;--rp-cc:#8a4457;"><use href="#rose"/></svg>'+
        '<div style="font-family:var(--script);color:var(--rose-deep);font-size:15px;margin-top:14px;">a letter, page by page</div>'+
        '</div>';
    }
  }
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length - 1;
  pageIndicator.textContent = (current+1) + ' / ' + pages.length;

  var closeBtn2 = document.getElementById('closeBtn2');
  if(closeBtn2){ closeBtn2.addEventListener('click', closeBook); }
  if(pages[current].isFinal){ spawnFinalPetals(); }
}

function setBandFaces(front, back){
  var bands = flipLeaf.querySelectorAll('.band');
  for(var i=0;i<bands.length;i++){
    bands[i].querySelector('.face.front').innerHTML = front;
    bands[i].querySelector('.face.back').innerHTML = back;
    bands[i].classList.remove('shading');
  }
}

function goNext(){
  if(animating || current >= pages.length-1) return;
  animating = true;
  var mobile = isMobile();
  var frontPage = pages[current];
  var backPage = pages[current+1];
  flipLeaf.className = 'flip-leaf active mode-right';
  setBandFaces(pageInnerHTML(frontPage), pageInnerHTML(backPage));
  rightPageEl.style.visibility = 'hidden';

  requestAnimationFrame(function(){
    var bands = flipLeaf.querySelectorAll('.band');
    for(var i=0;i<bands.length;i++) bands[i].classList.add('shading');
    flipLeaf.classList.add('next-active');
  });

  var dur = reduced ? 380 : 1260;
  setTimeout(function(){
    current += 1;
    finishFlip();
  }, dur);
}

function goPrev(){
  if(animating || current <= 0) return;
  animating = true;
  var frontPage = pages[current-1];
  var backPage = pages[current];
  flipLeaf.className = 'flip-leaf active mode-right';
  setBandFaces(pageInnerHTML(frontPage), pageInnerHTML(backPage));
  // start rotated to -178 (showing back) then animate to 0 (showing front)
  var bands = flipLeaf.querySelectorAll('.band');
  for(var i=0;i<bands.length;i++){ bands[i].style.transition='none'; bands[i].style.transform='rotateY(-178deg)'; }
  rightPageEl.style.visibility = 'hidden';

  requestAnimationFrame(function(){
    for(var i=0;i<bands.length;i++){
      bands[i].style.transition = '';
      bands[i].classList.add('shading');
    }
    flipLeaf.classList.add('prev-active');
  });

  var dur = reduced ? 380 : 1260;
  setTimeout(function(){
    current -= 1;
    finishFlip();
  }, dur);
}

function finishFlip(){
  flipLeaf.classList.remove('active','next-active','prev-active');
  var bands = flipLeaf.querySelectorAll('.band');
  for(var i=0;i<bands.length;i++){
    bands[i].style.transform = '';
    bands[i].style.transition = '';
    bands[i].classList.remove('shading');
  }
  rightPageEl.style.visibility = 'visible';
  renderStatic();
  animating = false;
}

/* ================= FINAL PAGE PETALS ================= */
var petalsSpawned = false;
function spawnFinalPetals(){
  if(petalsSpawned || reduced) return;
  petalsSpawned = true;
  setTimeout(function(){
    var host = document.getElementById('finalPetals');
    if(!host) return;
    for(var i=0;i<14;i++){
      (function(i){
        var el = document.createElement('div');
        el.className = 'petal-fall';
        el.style.position='absolute';
        el.style.top='-6%';
        el.style.left=(8+Math.random()*84)+'%';
        el.style.width='14px'; el.style.height='18px';
        el.style.opacity='0';
        el.innerHTML = '<svg viewBox="0 0 30 40" style="width:100%;height:100%;--rp-l:'+(i%2?'#eec7cd':'#f3d8c2')+';"><use href="#petal"/></svg>';
        el.style.animation = 'driftDown '+(5+Math.random()*3)+'s ease-in forwards';
        el.style.animationDelay = (i*0.28)+'s';
        host.appendChild(el);
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 9000+i*280);
      })(i);
    }
  }, 500);
}

/* ================= COVER OPEN/CLOSE ================= */
var book = document.getElementById('book');
var cover = document.getElementById('cover');
var closeBtnTop = document.getElementById('closeBtn');
var opened = false;

function openBook(){
  if(opened) return;
  opened = true;
  renderStatic();
  cover.style.transform = 'rotateY(-172deg)';
  setTimeout(function(){ closeBtnTop.classList.add('show'); }, reduced?400:1100);
}

function closeBook(){
  if(!opened) return;
  cover.style.transform = 'rotateY(0deg)';
  closeBtnTop.classList.remove('show');
  setTimeout(function(){
    opened = false;
    current = 0;
    petalsSpawned = false;
    renderStatic();
  }, reduced?400:1400);
}

document.getElementById('openBtn').addEventListener('click', openBook);
closeBtnTop.addEventListener('click', closeBook);

/* ================= NAV WIRING ================= */
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
document.getElementById('zoneRight').addEventListener('click', function(){ if(opened) goNext(); });
document.getElementById('zoneLeft').addEventListener('click', function(){ if(opened) goPrev(); });

document.addEventListener('keydown', function(e){
  if(!opened) return;
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

/* swipe support */
var touchStartX = null;
document.getElementById('bookWrap').addEventListener('touchstart', function(e){
  touchStartX = e.touches[0].clientX;
}, {passive:true});
document.getElementById('bookWrap').addEventListener('touchend', function(e){
  if(touchStartX === null || !opened) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0) goNext(); else goPrev();
  }
  touchStartX = null;
}, {passive:true});

window.addEventListener('resize', function(){ if(opened) renderStatic(); });

/* initial render (kept hidden until opened, but prep first page) */
renderStatic();

})();
</script>
